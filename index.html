<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4BV — Four pillars. One practice.</title>
  <meta name="description" content="4BV — physician-owned consulting at the intersection of medicine, technology, and contemplative practice.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://4bv.ai/">
  <meta property="og:title" content="4BV — Four pillars. One practice.">
  <meta property="og:description" content="Physician-owned consulting at the intersection of medicine, technology, and contemplative practice.">
  <meta property="og:image" content="https://4bv.ai/assets/logo.png">
  <meta property="og:image:alt" content="4BV — four interlocking blue circles">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="4BV — Four pillars. One practice.">
  <meta name="twitter:description" content="Physician-owned consulting at the intersection of medicine, technology, and contemplative practice.">
  <meta name="twitter:image" content="https://4bv.ai/assets/logo.png">

  <link rel="icon" type="image/png" href="assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Official brand colors */
      --ring-1: #AFDDFF; /* Pale Blue */
      --ring-2: #60A3D9; /* Light Blue */
      --ring-3: #003B73; /* Navy */
      --ring-4: #050A30; /* Dark Navy */

      --blue-mid: #60A3D9;
      --blue-deep: #050A30;

      --surface: oklch(1.0 0 0);
      --text-primary: oklch(0.22 0.02 258);
      --text-secondary: oklch(0.50 0.02 250);
      --text-tertiary: oklch(0.65 0.015 250);

      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 32px;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      background-color: var(--surface);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      overflow: hidden;
    }

    .site {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      max-width: 480px;
      width: 100%;
    }

    /* ---- SVG Logo ---- */
    .logo-svg {
      width: clamp(160px, 40vw, 240px);
      height: auto;
    }

    .ring {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      opacity: 0;
    }

    /* Each ring arrives from a different direction */
    .ring-1 {
      stroke: var(--ring-1);
      animation: ring1-arrive 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }
    .ring-2 {
      stroke: var(--ring-2);
      animation: ring2-arrive 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .ring-3 {
      stroke: var(--ring-3);
      animation: ring3-arrive 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }
    .ring-4 {
      stroke: var(--ring-4);
      animation: ring4-arrive 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    }

    /* Animations: each ring arrives from its own quadrant */
    @keyframes ring1-arrive {
      from { opacity: 0; transform: translate(14px, -14px); }
      to   { opacity: 1; transform: translate(0, 0); }
    }
    @keyframes ring2-arrive {
      from { opacity: 0; transform: translate(-14px, -14px); }
      to   { opacity: 1; transform: translate(0, 0); }
    }
    @keyframes ring3-arrive {
      from { opacity: 0; transform: translate(-14px, 14px); }
      to   { opacity: 1; transform: translate(0, 0); }
    }
    @keyframes ring4-arrive {
      from { opacity: 0; transform: translate(14px, 14px); }
      to   { opacity: 1; transform: translate(0, 0); }
    }

    /* ---- Wordmark ---- */
    .wordmark {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: 0.18em;
      color: var(--blue-deep);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      animation: text-arrive 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
    }

    /* ---- Tagline ---- */
    .tagline {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(8px);
      animation: text-arrive 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.1s forwards;
    }

    /* ---- Divider ---- */
    .divider {
      width: 32px;
      height: 1px;
      background-color: var(--blue-mid);
      opacity: 0;
      animation: text-arrive 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;
    }

    /* ---- Contact ---- */
    .contact {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      opacity: 0;
      transform: translateY(8px);
      animation: text-arrive 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.6s forwards;
    }

    .contact .email {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .contact a {
      color: var(--text-tertiary);
      text-decoration: none;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      transition: color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .contact a:hover {
      color: var(--blue-mid);
    }

    .contact a:focus-visible {
      outline: 2px solid var(--blue-mid);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .linkedin-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    @keyframes text-arrive {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---- Reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      .ring,
      .wordmark,
      .tagline,
      .divider,
      .contact {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    @media (max-height: 500px) {
      body { padding: var(--space-md); }
      .site { gap: var(--space-md); }
    }
  </style>
</head>
<body>

  <main class="site">

    <!-- SVG Logo: 4 interlocking rings — darkest behind, lightest in front -->
    <svg class="logo-svg" viewBox="5 0 230 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4BV — four interlocking circles">
      <!-- Ring 4: Dark Navy, lower-right (behind) -->
      <circle class="ring ring-4" cx="125" cy="132" r="82" />
      <!-- Ring 3: Navy, lower-left -->
      <circle class="ring ring-3" cx="108" cy="123" r="82" />
      <!-- Ring 2: Light Blue, upper-left -->
      <circle class="ring ring-2" cx="106" cy="104" r="82" />
      <!-- Ring 1: Pale Blue, upper-right (in front) -->
      <circle class="ring ring-1" cx="132" cy="106" r="82" />
    </svg>

    <h1 class="wordmark">4BV</h1>

    <p class="tagline">Four pillars. One practice.</p>

    <div class="divider" aria-hidden="true"></div>

    <nav class="contact" aria-label="Contact">
      <a href="mailto:doc@4bv.ai" class="email">doc@4bv.ai</a>
      <a href="https://www.linkedin.com/in/michaelhobbsmd/" aria-label="LinkedIn">
        <svg class="linkedin-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </a>
    </nav>
  </main>

</body>
</html>
